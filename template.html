<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{DOC_TITLE}}</title>
<style>
body{margin:0;background:#f7f8fa;color:#222;font:18px/1.8 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1100px;margin:auto;padding:48px 24px 80px}
h1{font-size:30px;margin:0 0 8px}.sub{color:#777;margin-bottom:40px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 12px #0001;padding:32px 36px;margin-bottom:40px}
.card h2{margin:0 0 24px;font-size:24px}.card h2 span{font-family:Menlo,monospace;color:#2f6fed;margin-right:12px}
.flow{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:14px}
.cell{font:16px/1.7 Menlo,Consolas,monospace;background:#fafbfc;border:2px solid #dde1e6;border-radius:12px;padding:14px 20px;white-space:pre}
.cell .n{color:#999;font-size:13px;display:block}
.arrow{font-size:40px;color:#bbb}
.hl{background:#fff1b8;color:#b45309;border-radius:4px;padding:0 4px;font-weight:700}
.extra{margin-top:18px;font:15px Menlo,monospace;color:#555}
.limits{margin-top:26px;border-top:1px dashed #ddd;padding-top:18px}
.limits h3{font-size:18px;margin:0 0 8px;color:#555}
.limits li{margin:6px 0}.limits b{font-family:Menlo,monospace;color:#b45309;font-weight:600}
.e{color:#d93025;font-family:Menlo,monospace;font-size:15px}.note{color:#888;font-size:15px}
.layout{margin-top:22px;background:#fafbfc;border:2px solid #dde1e6;border-radius:12px;padding:16px 20px}
.strip{display:flex;gap:3px;margin:8px 0 14px;font:14px Menlo,monospace}.seg{border-radius:6px;padding:8px 6px;text-align:center;min-width:56px}.seg b{display:block}.seg small{opacity:.75}
.c0{background:#e5e7eb}.c1{background:#dbeafe}.c2{background:#fde68a}.c3{background:#bbf7d0}.c4{background:#e9d5ff}.c5{background:#fecaca}
.fields{list-style:none;padding:0;margin:0}.fields li{margin:6px 0;font-size:16px}.fields b{font-family:Menlo,monospace}.sz{font:13px Menlo,monospace;color:#888}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:middle}.cons{color:#b45309}
.hex{margin-top:12px;font:14px/1.7 Menlo,monospace;word-break:break-all;background:#fff;border:1px dashed #ccc;border-radius:8px;padding:10px 14px}.hk{color:#888;display:inline-block;min-width:150px}
html[data-lang=zh] [data-l=en],html[data-lang=en] [data-l=zh]{display:none}
#lang{position:fixed;top:18px;right:22px;font:15px -apple-system,sans-serif;padding:6px 16px;border:1px solid #ccc;border-radius:20px;background:#fff;cursor:pointer;box-shadow:0 1px 4px #0001}
.idx{font-size:20px;line-height:2.2}.idx a{color:#2f6fed;text-decoration:none}
.cell,.hex,.kv,pre{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.strip{overflow-x:auto;-webkit-overflow-scrolling:touch}.seg{flex-shrink:0}
img,svg{max-width:100%}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tag{font:13px -apple-system,sans-serif;padding:3px 10px;border-radius:12px;background:#eef2fb;color:#344;border:1px solid #dde3f0;cursor:default}
button.tag{cursor:pointer;min-height:32px}button.tag[aria-pressed="true"]{background:#2f6fed;color:#fff;border-color:#2f6fed}
.g-kind{background:#f3eefc}.g-network{background:#eaf7ef}.g-source{background:#fdf3e6}.g-maintainer{background:#f1f1f1}
.badge{font:12px -apple-system,sans-serif;padding:2px 8px;border-radius:10px;vertical-align:middle;border:1px solid}.b-verified{color:#17803d;border-color:#17803d}.b-unverified{color:#a26100;border-color:#a26100}.b-mismatch{color:#c0262d;border-color:#c0262d}.b-no-source,.b-builtin{color:#666;border-color:#999}
.filters{margin:10px 0}.fg{margin:6px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.fg b{font-size:14px;margin-right:4px}
.cards{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.ci{border:1px solid #e3e7ef;border-radius:12px;padding:12px 14px}.ci a{color:#2f6fed;text-decoration:none;font-size:18px}
.mono{font-family:Menlo,monospace}.av img{border-radius:50%;vertical-align:middle}.avs{display:flex;gap:4px}.people{list-style:none;padding:0;line-height:2}.credit{font-size:14px;margin:6px 0}
.prov summary{cursor:pointer;font-size:18px;font-weight:600}.prov .kv{margin:8px 0;font-size:14px;word-break:break-all}.tbl{overflow-x:auto}.prov table{border-collapse:collapse;font-size:13px}.prov td,.prov th{border:1px solid #e3e7ef;padding:4px 8px;text-align:left;white-space:nowrap}
#q{width:100%;font-size:16px;padding:10px 12px;border:1px solid #ccd;border-radius:10px}
@media (max-width:760px){.cards{grid-template-columns:1fr}.prov td,.prov th{font-size:12px}}
@media (max-width:760px){
 body{font-size:16px}main{padding:56px 12px 48px}h1{font-size:22px}
 .card{padding:18px 14px;border-radius:12px;margin-bottom:22px}.card h2{font-size:19px}
 .flow{flex-direction:column;align-items:stretch;gap:10px}.col{width:100%}
 .arrow{transform:rotate(90deg);text-align:center;align-self:center;font-size:30px;line-height:1}
 .cell{font-size:13px;padding:10px 12px;white-space:pre;max-width:100%}
 .layout{padding:12px}.strip{flex-wrap:wrap}.seg{min-width:calc(25% - 3px);flex:1 1 auto!important}
 .fields li{font-size:14px}.hex{font-size:12px}.hk{min-width:0;display:block}
 #lang{top:10px;right:10px;padding:10px 18px;font-size:16px;min-height:44px}
 .form{flex-direction:column;align-items:stretch}.form input,.form select,.go{width:100%;min-width:0!important;font-size:16px;min-height:44px}
 .limits li{font-size:15px}.extra{font-size:13px;overflow-x:auto}
}
</style>
<script>(function(){var k='ckb-flow-lang',l=null;try{l=localStorage.getItem(k)}catch(e){}if(l!=='zh'&&l!=='en')l=/^zh/i.test(navigator.language||'')?'zh':'en';document.documentElement.setAttribute('data-lang',l);document.documentElement.lang=l==='zh'?'zh-CN':'en';
window.toggleLang=function(){var n=document.documentElement.getAttribute('data-lang')==='zh'?'en':'zh';document.documentElement.setAttribute('data-lang',n);document.documentElement.lang=n==='zh'?'zh-CN':'en';try{localStorage.setItem(k,n)}catch(e){}};})();</script></head><body><button id="lang" onclick="toggleLang()" aria-label="Switch language / 切换语言">{{TOGGLE}}</button>
<main>
<h1>{{TITLE}}</h1>
<div class="sub">{{SUBTITLE}}</div>
{{CARDS}}
{{FOOTER}}

</main></body></html>
