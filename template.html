<style>

.g-kind{background:#f5f3ff;border-color:#e9e3ff}.g-category{background:#eff6ff;border-color:#dbeafe}.g-network{background:#f0fdf4;border-color:#dcfce7}.g-source{background:#fff7ed;border-color:#ffedd5}.g-project{background:#e0f2fe;border-color:#bae6fd;color:#075985;font-weight:600}

button.tag{font-size:14px;min-height:34px;padding:4px 12px;cursor:pointer}button.tag:hover{border-color:#93c5fd}button.tag[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}button.tag small{font-size:12px;opacity:.7}

.fields b{font-family:var(--mono)}.sz{font:12.5px var(--mono);color:var(--ink3);margin-left:6px}.dot{display:inline-block;width:12px;height:12px;border-radius:3px;align-self:center}.cons{color:#b45309;font-weight:600}

.row{display:flex;flex-wrap:wrap;gap:8px}.row input{flex:1 1 220px}

.cats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}

function set(n){var d=document.documentElement;d.setAttribute('data-lang',n);d.lang=n==='zh'?'zh-CN':'en';if(document.querySelectorAll)['title','placeholder','aria-label','text'].forEach(function(a){[].forEach.call(document.querySelectorAll('[data-'+n+'-'+a+']'),function(e){var v=e.getAttribute('data-'+n+'-'+a);if(a==='text')e.textContent=v;else e.setAttribute(a,v)})})}
set(l);if(document.addEventListener)document.addEventListener('DOMContentLoaded',function(){set(document.documentElement.getAttribute('data-lang'))});
window.toggleLang=function(){var n=document.documentElement.getAttribute('data-lang')==='zh'?'en':'zh';set(n);try{localStorage.setItem(k,n)}catch(e){}};})();</script></head><body>
